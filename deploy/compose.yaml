name: marketradar

services:
  marketradar-go:
    build:
      context: ..
      dockerfile: Dockerfile
    image: marketradar-go:${MARKETRADAR_IMAGE_TAG:-latest}
    command: ["bot"]
    network_mode: host
    restart: unless-stopped
    init: true
    env_file:
      - path: ${MARKETRADAR_ENV_FILE:-/opt/marketradar/secrets/marketradar.env}
        required: true
    environment:
      ADMIN_COOKIE_SECURE: "true"
      SQLITE_PATH: /app/data/tradebot.db
      ADMIN_LISTEN_ADDR: 127.0.0.1:8088
    volumes:
      - marketradar-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8088/app/",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  marketradar-admin:
    build:
      context: ../admin-next
      dockerfile: Dockerfile
    image: marketradar-admin:${MARKETRADAR_IMAGE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      GO_ADMIN_URL: http://127.0.0.1:8088
    depends_on:
      marketradar-go:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  marketradar-data:
    name: marketradar-data
