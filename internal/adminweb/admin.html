<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت MarketRadar</title>
<style>body{font:16px/1.8 system-ui,sans-serif;background:#f2f5fb;color:#192841;margin:0}main{max-width:1200px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:0 8px 28px #18365812}h1{margin:0 0 20px}h2{margin:0 0 14px}button,input{font:inherit;padding:9px 13px;border-radius:9px}button{background:#155bc4;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}input{border:1px solid #b9c8dc;max-width:100%;box-sizing:border-box}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;text-align:right;border-bottom:1px solid #dce3ed}th{background:#eaf1fb}tr:hover{background:#f8faff}.fields{display:flex;flex-wrap:wrap;gap:8px}.status{padding:10px;border-radius:9px;background:#eaf1fb}.error{background:#ffe8e8;color:#8d1b1b}.success{background:#e3f5e9;color:#145637}pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:10px}dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}dt{font-weight:bold}dd{margin:0;overflow-wrap:anywhere}@media(max-width:650px){main{padding:12px}dl{grid-template-columns:1fr}}</style>
<main><h1>مدیریت مارکت‌رادار</h1><p id="notice" class="status" role="status">در حال بارگذاری…</p>
<section class="card"><h2>کاربران تلگرام</h2><div class="table"><table><thead><tr><th>شناسه</th><th>اشتراک</th><th>اعتبار تا</th><th>تحلیل رایگان امروز</th><th>معافیت</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="card"><h2>حساب‌های وب</h2><div class="table"><table><thead><tr><th>شناسه</th><th>ایمیل</th><th>اعتبار اشتراک</th><th>آدرس عمومی</th></tr></thead><tbody id="webusers"></tbody></table></div></section>
<section class="card"><h2>پرداخت‌های نیازمند بررسی</h2><div class="table"><table><thead><tr><th>تراکنش</th><th>فاکتور</th><th>مبلغ BNB</th><th>وضعیت</th><th>زمان</th></tr></thead><tbody id="payments"></tbody></table></div></section>
<section class="card"><h2>قیمت اشتراک یک‌ماهه</h2><p id="plan"></p><div class="fields"><input id="price" placeholder="مبلغ BNB، مثلاً 0.01" inputmode="decimal"><button onclick="setPrice()">ثبت قیمت</button></div></section>
<section class="card"><h2>جست‌وجوی شماره پیگیری تحلیل</h2><div class="fields"><input id="aid" placeholder="UUID تحلیل" style="min-width:300px"><button onclick="findAnalysis()">جست‌وجو</button></div><div id="analysis"></div></section>
<section class="card"><h2>نسخهٔ تنظیمات تحلیل</h2><p id="config"></p><button onclick="setConfig(1)">فعال‌سازی ۵۰۰/۵۰۰</button> <button onclick="setConfig(2)">فعال‌سازی ۵۰۰/۵۰</button></section></main>
<script>
const el=id=>document.getElementById(id);function note(s,kind=''){el('notice').textContent=s;el('notice').className='status '+kind}function empty(v){return v===null||v===undefined||v===''?'ثبت نشده':String(v)}function bnb(wei){if(!wei)return 'ثبت نشده';let n=BigInt(wei),a=n/1000000000000000000n,b=(n%1000000000000000000n).toString().padStart(18,'0').replace(/0+$/,'');return a.toString()+(b?'.'+b:'')}
function rows(id,items,fields){let body=el(id);body.replaceChildren();if(!Array.isArray(items)||items.length===0){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=fields.length;td.textContent='موردی ثبت نشده است';tr.append(td);body.append(tr);return}for(let item of items){let tr=document.createElement('tr');for(let f of fields){let td=document.createElement('td');let v=f(item);if(v instanceof Node)td.append(v);else td.textContent=empty(v);tr.append(td)}body.append(tr)}}
async function get(path){let r=await fetch(path);if(!r.ok)throw Error('دریافت اطلاعات ناموفق بود');return r.json()}async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});if(!r.ok)throw Error('ثبت تغییر ناموفق بود');return r.json()}
async function load(){try{let [users,webusers,payments,c,p]=await Promise.all([get('/api/users'),get('/api/web-users'),get('/api/web-payments'),get('/api/config'),get('/api/web-plan')]);rows('users',users,[u=>u.id,u=>u.subscription_active?'فعال':'غیرفعال',u=>u.subscription_until,u=>u.exempt?'نامحدود':u.free_remaining,u=>{let b=document.createElement('button');b.textContent=u.exempt?'لغو معافیت':'فعال‌سازی معافیت';b.onclick=async()=>{try{await post('/api/exemption',{user_id:u.id,exempt:!u.exempt});note('معافیت به‌روزرسانی شد','success');load()}catch(e){note(e.message,'error')}};return b}]);rows('webusers',webusers,[u=>u.id,u=>u.email,u=>u.subscription_until,u=>u.address]);rows('payments',payments,[p=>p.TxHash,p=>p.InvoiceID,p=>bnb(p.AmountWei),p=>p.Classification,p=>p.BlockTime]);el('config').textContent='نسخه '+c.version+' — '+c.engine_candles+' کندل موتور / '+c.model_candles+' کندل مدل';el('plan').textContent=p.configured?'قیمت فعلی: '+bnb(p.price_wei)+' BNB':'قیمت هنوز تعیین نشده است';note('اطلاعات به‌روز شد','success')}catch(e){note(e.message,'error')}}
async function setConfig(v){try{await post('/api/config',{version:v});load()}catch(e){note(e.message,'error')}}async function setPrice(){try{await post('/api/web-plan',{price_bnb:el('price').value});load()}catch(e){note(e.message,'error')}}
async function findAnalysis(){let id=el('aid').value.trim();if(!id){note('شماره پیگیری را وارد کنید','error');return}try{let a=await get('/api/analysis?id='+encodeURIComponent(id)),box=el('analysis');box.replaceChildren();let card=document.createElement('div'),title=document.createElement('h3');title.textContent='تحلیل '+id;card.append(title);let dl=document.createElement('dl');for(let [label,key] of [['کاربر','user_id'],['نماد','symbol'],['تایم‌فریم','timeframe'],['وضعیت','status'],['مدل','model'],['پرامپت','prompt_version'],['کندل موتور','engine_candles'],['کندل مدل','model_candles'],['تحویل تلگرام','delivery_status']]){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=empty(a[key]);dl.append(dt,dd)}card.append(dl);let details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='نمایش JSON کامل';pre.textContent=JSON.stringify(a,null,2);details.append(summary,pre);card.append(details);box.append(card);note('تحلیل پیدا شد','success')}catch(e){el('analysis').textContent='تحلیل پیدا نشد';note('تحلیل پیدا نشد','error')}}load();
</script></html>
